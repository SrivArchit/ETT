name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + quick AI benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q

      - name: Quick benchmark (5 games)
        run: python bench.py --games 5 --markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f dockerfile -t 2048-ai .
